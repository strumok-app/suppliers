[package]
name = "strumok_suppliers"
version = "5.0.2"
edition = "2024"

# `md-5` is imported as `md5`, which cargo-machete's name-based heuristic
# cannot detect, so it is ignored to avoid a false positive.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lib]
crate-type = ["cdylib", "staticlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dependencies.reqwest]
features = [
    "charset",
    "http2",
    "rustls",
    "cookies",
    "query",
    "form",
    "json",
    # Compression
    "brotli",
    "gzip",
]
version = "0.13.2"
default-features = false

[dependencies.tokio]
version = "1.50.0"
features = ["rt-multi-thread", "macros"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
log = { version = "0.4.29", features = ["release_max_level_info"] }
test-log = "0.2.19"
md-5 = "0.11.0"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
aes = "0.9.4"
aes-gcm = "0.11.1"
base64 = "0.23.1"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "https-aws-lc-rs", "webpki-roots"] }
anyhow = "1.0.102"
enum_dispatch = "0.3.13"
strum = { version = "0.28.0", features = ["strum_macros"] }
strum_macros = "0.28.0"
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
scraper = "0.29.0"
regex = "1.12.3"
chrono = "0.4.44"
futures = "0.3.32"
indexmap = "2.13.0"
